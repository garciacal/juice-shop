name: DevSecOps Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Ejecutar Semgrep
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            semgrep/semgrep \
            semgrep scan --config auto /src

  secret-analysis:
    name: Secret Analysis - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ejecutar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-trivy:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest


    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4


      - name: Construir imagen Docker de Juice Shop
        run: |
          docker build -t juice-shop-secure:${{ github.sha }} .


      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'juice-shop-secure:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
