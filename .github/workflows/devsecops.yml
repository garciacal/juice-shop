name: DevSecOps Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Ejecutar Semgrep
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            semgrep/semgrep \
            semgrep scan --config auto /src

  secret-analysis:
    name: Secret Analysis - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ejecutar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-trivy:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest


    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4


      - name: Construir imagen Docker de Juice Shop
        run: |
          docker build -t juice-shop-secure:${{ github.sha }} .


      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'juice-shop-secure:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  dast-zap:
    name: DAST - OWASP ZAP Baseline
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: |
          docker build -t juice-shop-dast .

      - name: Desplegar Juice Shop
        run: |
          docker run -d \
            --name juice-shop-dast \
            -p 3000:3000 \
            juice-shop-dast

      - name: Esperar a que Juice Shop este disponible
        run: |
          for i in {1..30}; do
            if curl -f http://127.0.0.1:3000 >/dev/null 2>&1; then
              echo "Juice Shop esta disponible"
              exit 0
            fi
            echo "Esperando a Juice Shop..."
            sleep 5
          done
          echo "Juice Shop no ha arrancado"
          docker logs juice-shop-dast
          exit 1

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://172.17.0.1:3000'
          fail_action: false
          allow_issue_writing: false
          artifact_name: 'zap-baseline-report'
